name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install package and release tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install ".[dev,ui]"

      - name: Run release quality gates
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check scripts tests
          python -m ruff format --check scripts tests
          python -m mypy scripts/frame_timing_agent
          python -m pytest --cov=frame_timing_agent --cov-report=term-missing --cov-fail-under=90
          python -m compileall -q scripts examples tests

      - name: Build, check, and audit distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python -m build
          python -m twine check dist/*
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          blocked = (
              "/tests/",
              "/docs/",
              "/.github/",
              "/examples/",
              "/output/",
              "AGENTS.md",
              "handoff.md",
              "__pycache__",
          )
          dist = Path("dist")
          archives = list(dist.glob("*.whl")) + list(dist.glob("*.tar.gz"))
          if not archives:
              raise SystemExit("no distributions built")
          for archive in archives:
              if archive.suffix == ".whl":
                  with zipfile.ZipFile(archive) as zf:
                      names = zf.namelist()
              else:
                  with tarfile.open(archive, "r:gz") as tf:
                      names = tf.getnames()
              bad = [name for name in names if any(token in name for token in blocked)]
              if bad:
                  raise SystemExit(f"{archive.name} contains non-release files: {bad}")
          PY

      - name: Validate skill metadata
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("SKILL.md").read_text(encoding="utf-8")
          normalized = text.replace("\r\n", "\n")
          if not normalized.startswith("---\n"):
              raise SystemExit("SKILL.md missing YAML frontmatter")
          parts = normalized.split("---", 2)
          frontmatter = parts[1]
          if "name: frame-timing-skill" not in frontmatter:
              raise SystemExit("unexpected skill name")
          if "description: Use when" not in frontmatter:
              raise SystemExit("skill description must start with 'Use when'")
          PY

      - name: Installed CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          source="$(pwd)"
          host_dir="$RUNNER_TEMP/frame-timing-host"
          mkdir -p "$host_dir"
          cd "$host_dir"
          python -m pip install "$source"
          frame-timing-demo --output_dir output/demo_frames/sample --count 12
          frame-timing output/demo_frames/sample --artifact_root output/ci_demo --limit_first_n 12
          frame-timing-health --artifact_root output/ci_demo
          frame-timing-tool capabilities
          frame-timing-benchmark --help
          frame-timing-ui --smoke-test
