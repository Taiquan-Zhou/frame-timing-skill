[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-timing-skill"
version = "0.5.0"
description = "Agent-ready frame analysis and selection engine with audited local workflows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  {name = "Frame Timing Skill contributors"},
]
keywords = [
  "agent-skill",
  "frame-timing",
  "video-frames",
  "reconstruction",
  "provenance",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "opencv-python>=4.8,<4.13",
  "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
ui = [
  "PySide6-Essentials>=6.6,<6.9",
]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.10,<2",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "twine>=5,<8",
]
release = [
  "PyInstaller>=6.14,<7",
  "PySide6-Essentials>=6.6,<6.9",
]

[project.urls]
Homepage = "https://github.com/Taiquan-Zhou/frame-timing-skill"
Source = "https://github.com/Taiquan-Zhou/frame-timing-skill"
Issues = "https://github.com/Taiquan-Zhou/frame-timing-skill/issues"

[project.scripts]
frame-timing = "frame_timing_agent.simple_cli:main"
frame-timing-batch = "frame_timing_agent.batch_timing_agent:main"
frame-timing-health = "frame_timing_agent.batch_artifact_health:main"
frame-timing-demo = "frame_timing_agent.demo_frames:main"
frame-timing-tool = "frame_timing_agent.tool_cli:main"
frame-timing-benchmark = "frame_timing_agent.benchmark_cli:main"
frame-timing-ui = "frame_timing_agent.ui.app:main"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.setuptools.packages.find]
where = ["scripts"]

[tool.setuptools.package-data]
frame_timing_agent = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.coverage.report]
precision = 2

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = [
  "frame_timing_agent.auto_timing_agent",
  "frame_timing_agent.batch_artifact_health",
  "frame_timing_agent.batch_timing_agent",
  "frame_timing_agent.demo_frames",
  "frame_timing_agent.human_review",
  "frame_timing_agent.motion_estimator",
  "frame_timing_agent.strategy_execution_audit",
  "frame_timing_agent.strategy_visual_review",
  "frame_timing_agent.timing_report",
]
disallow_any_generics = false
disallow_untyped_defs = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
  "frame_timing_agent.ui",
  "frame_timing_agent.ui.*",
]
ignore_errors = true
